# SPDX-License-Identifier: GPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # End-to-end tests skip themselves here; they run in the e2e job.
      - run: cargo test --workspace
      - run: cargo build --release -p infrasonic

  e2e:
    name: End-to-end (Navidrome, gonic)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Pull server images
        run: docker pull deluan/navidrome:latest && docker pull sentriz/gonic:latest
      - run: cargo test --no-run -p infrasonic-e2e -p infrasonic -p infrasonic-headless --tests
      - run: scripts/e2e-servers.sh cargo test -p infrasonic-e2e -p infrasonic -p infrasonic-headless --tests

  web:
    name: Web player (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, mobile]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - run: cargo check -p infrasonic-engine --features cpal/wasm-bindgen --target wasm32-unknown-unknown
      - name: wasm-bindgen CLI
        run: |
          v=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$v" --locked
      - run: scripts/web.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        run: |
          npm install --no-save --prefix crates/web/tests playwright@1
          b=${{ matrix.browser }}; [ "$b" = mobile ] && b=chromium
          npx --prefix crates/web/tests playwright install --with-deps "$b"
      - name: Pull server images
        run: docker pull deluan/navidrome:latest && docker pull sentriz/gonic:latest
      # Firefox plays nothing without a sound server; a null sink is enough.
      - name: Sound server
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=null
          pactl set-default-sink null
      - name: Browser test against Navidrome and gonic
        run: |
          python3 -m http.server 8098 --bind 127.0.0.1 --directory target/web &
          b=${{ matrix.browser }}; flags=""
          [ "$b" = mobile ] && b=chromium && flags=--mobile
          scripts/e2e-servers.sh node crates/web/tests/browser.mjs http://127.0.0.1:8098/ "$b" $flags

  android:
    name: Android build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build for aarch64-linux-android
        run: |
          TC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo check --target aarch64-linux-android -p infrasonic-engine -p infrasonic-subsonic
          cargo check --target aarch64-linux-android -p infrasonic-core --no-default-features
          cargo build --release --target aarch64-linux-android -p infrasonic-headless
          file target/aarch64-linux-android/release/infrasonic-headless
      - uses: actions/upload-artifact@v4
        with:
          name: infrasonic-headless-aarch64-linux-android
          path: target/aarch64-linux-android/release/infrasonic-headless
          retention-days: 14

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
