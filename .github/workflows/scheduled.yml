# SPDX-License-Identifier: GPL-3.0-only
# Long-running checks: fuzzing and the soak test. Nightly, and on demand.
name: Fuzz and soak

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds per fuzz target
        default: "600"
      soak_seconds:
        description: Soak test duration per server in seconds
        default: "1800"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [subsonic_response, config, decode, queue, stream_reader]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # Inputs through the environment, never spliced into the script.
      - env:
          FUZZ_SECONDS: ${{ inputs.fuzz_seconds || '600' }}
          TARGET: ${{ matrix.target }}
        run: scripts/fuzz.sh "$FUZZ_SECONDS" "$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts

  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --release --no-run -p infrasonic-e2e --test soak
      - name: Soak
        env:
          INFRASONIC_SOAK_SECS: ${{ inputs.soak_seconds || '1800' }}
          INFRASONIC_SOAK_SEED: ${{ github.run_id }}
        run: scripts/e2e-servers.sh cargo test --release -p infrasonic-e2e --test soak -- --nocapture
