# SPDX-License-Identifier: GPL-3.0-only
# Publishes the web player. Every push to main that touches it deploys it to GitHub Pages and
# publishes the container image ghcr.io/fionapreroll/infrasonic-web:snapshot (amd64, arm64);
# tags web-v* publish the image as :<version> and :latest. Pushes that only change e.g. the
# Android app, the TUI or documentation skip both.
name: Web player deploy

on:
  push:
    branches: [main]
    tags: ["web-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Web player changed?
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # Tags, manual runs and pushes without a usable base always build.
          if [ "$EVENT" != push ] || [ "$REF_TYPE" = tag ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo web=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          relevant=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" \
            | grep -Ev '^(android/|fastlane/|scripts/android-|crates/(ffi|tui|headless)/|\.github/workflows/(android|ci)\.yml$|LICENSE$)|\.md$' || true)
          printf 'Changes that affect the web player:\n%s\n' "${relevant:-(none)}"
          if [ -n "$relevant" ]; then echo web=true; else echo web=false; fi >> "$GITHUB_OUTPUT"

  pages:
    name: GitHub Pages
    needs: changes
    # The github-pages environment only accepts the default branch.
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - name: wasm-bindgen CLI
        run: |
          v=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$v" --locked
      - run: scripts/web.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/web
      - id: deploy
        uses: actions/deploy-pages@v4

  image:
    name: Container image
    needs: changes
    if: >-
      startsWith(github.ref, 'refs/tags/web-v') ||
      (github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true')
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fionapreroll/infrasonic-web
          tags: |
            type=match,pattern=web-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/web-v') }}
            type=raw,value=snapshot,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/web/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Also names the service worker cache, so every snapshot gets a new one.
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('snapshot-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
