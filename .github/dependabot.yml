# Keeps the pinned actions, the base images and the Rust crates current. Once a week, grouped
# into one pull request per ecosystem, so updates come as few reviews as possible.
#
# Not here: Gradle. Its dependencies are checked against android/gradle/verification-metadata.xml,
# which Dependabot does not update; bump them in android/gradle/libs.versions.toml by hand and
# regenerate the file with scripts/gradle-verification.sh.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # Major versions change behaviour; they are taken by hand. Security updates come anyway.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /crates/web/docker
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Security fixes always; version updates only within the ranges in Cargo.toml.
    versioning-strategy: lockfile-only
    groups:
      crates:
        patterns: ["*"]
