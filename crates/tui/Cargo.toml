[package]
name = "infrasonic"
description = "Terminal music player for Subsonic and OpenSubsonic servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["subsonic", "navidrome", "music", "tui", "player"]
categories = ["command-line-utilities", "multimedia::audio"]

[features]
default = ["media-controls", "cover-art", "keyring"]
# MPRIS (Linux), Now Playing (macOS) and SMTC (Windows).
media-controls = ["dep:souvlaki"]
cover-art = ["dep:ratatui-image", "dep:image"]
keyring = ["infrasonic-core/keyring"]

[dependencies]
infrasonic-core.workspace = true
infrasonic-engine = { workspace = true, features = ["cpal-output"] }
infrasonic-subsonic.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs"] }
futures.workspace = true
parking_lot.workspace = true
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
clap = { version = "4.6", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-width = "0.2"
toml.workspace = true
souvlaki = { version = "0.9.3", optional = true, default-features = false, features = ["use_zbus"] }
ratatui-image = { version = "11.1", optional = true, default-features = false, features = ["crossterm"] }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
infrasonic-e2e = { path = "../e2e" }
tempfile.workspace = true

[lints]
workspace = true
