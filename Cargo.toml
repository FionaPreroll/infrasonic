[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/subsonic", "crates/engine", "crates/core", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/FionaPreroll/infrasonic"
authors = ["Fiona"]

[workspace.dependencies]
infrasonic-subsonic = { path = "crates/subsonic", version = "0.1.0" }
infrasonic-engine = { path = "crates/engine", version = "0.1.0", default-features = false }
infrasonic-core = { path = "crates/core", version = "0.1.0" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
url = "2"
md-5 = "0.11"
hex = "0.4"
rand = "0.10"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "rustls-no-provider", "charset", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
symphonia = { version = "0.6.1", default-features = false }
opus-decoder = "0.1.1"
cpal = "0.18.2"
rubato = "5.1"
rtrb = "0.4"
crossbeam-channel = "0.5"
parking_lot = "0.12"
tempfile = "3"
proptest = "1"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
